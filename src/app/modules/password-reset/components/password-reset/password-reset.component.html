<form
  fsForm
  [submit]="submit"
  [dirtySubmitButton]="false">
  @switch (mode) {
    @case ('request') {
      <mat-form-field class="full-width">
        <mat-label>
          Email
        </mat-label>
        <input
          matInput
          [required]="true"
          fsFormEmail
          [autocomplete]="'off'"
          [(ngModel)]="email"
          [fsAutofocus]="true"
          name="email">
      </mat-form-field>
      <app-stacked-buttons>
        <button
          mat-flat-button
          color="primary"
          name="request"
          type="submit">
          Continue
        </button>
        <button
          mat-stroked-button
          color="basic"
          type="button"
          [disabled]="form?.submitting"
          (click)="cancel()">
          Cancel
        </button>
      </app-stacked-buttons>
    }
    @case ('code') {
      <fs-code-input
        [(ngModel)]="code"
        name="code"
        [validateOnSubmit]="true"
        [fsFormFunction]="validateExists"
        [required]="true">
      </fs-code-input>
      <app-stacked-buttons>
        <button
          #continue
          mat-flat-button
          color="primary"
          name="code"
          type="submit">
          Verify code
        </button>
        <button
          mat-stroked-button
          color="basic"
          type="button"
          [disabled]="form?.submitting"
          (click)="cancel()">
          Cancel
        </button>
      </app-stacked-buttons>
    }
    @case ('password') {
      <mat-form-field class="full-width form-field-multiline-subscript">
        <mat-label>
          Password
        </mat-label>
        <input
          matInput
          fsPassword
          [strength]="true"
          [autocomplete]="'off'"
          name="password"
          [required]="true"
          [fsAutofocus]="true"
          [(ngModel)]="password"
          type="password">
      </mat-form-field>
      <app-stacked-buttons>
        <button
          mat-flat-button
          color="primary"
          name="password"
          type="submit">
          Save new password
        </button>
        <button
          mat-stroked-button
          color="basic"
          type="button"
          [disabled]="form?.submitting"
          (click)="cancel()">
          Cancel
        </button>
      </app-stacked-buttons>
    }
  }
</form>
